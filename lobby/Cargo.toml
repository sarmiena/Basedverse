[package]
name = "lobby"
version = "4.3.2"
edition = "2021"
license = "MIT"
description = "The lobby (../LOBBY.md): who is online, knocks, visits and links between visit-clients, world groups, chat; one program, for anyone to host"
publish = false

[dependencies]
lobby-proto = { path = "proto" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
getrandom = "0.3.4"
argon2 = "0.5.3"
iroh-base = { version = "1.4.1", default-features = false, features = ["key"] }
iroh-relay = { version = "1.4.1", features = ["server"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
turn = "0.17.2"
webrtc-util = { version = "0.17.2", default-features = false, features = ["conn", "vnet"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
iroh = "1.4"
tokio-tungstenite = "0.30.0"
rcgen = "0.14"
